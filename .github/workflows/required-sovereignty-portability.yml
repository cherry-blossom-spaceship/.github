name: Required Sovereignty / Portability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  required-sovereignty-portability:
    uses: ./.github/workflows/sovereignty-portability.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      governance_ref: ${{ github.event.pull_request.head.ref }}
