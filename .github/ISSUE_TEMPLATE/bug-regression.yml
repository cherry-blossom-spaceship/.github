name: Bug / regression
description: Report something broken or a behaviour that has regressed.
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / logs
      description: Include relevant logs, screenshots, or run links. Redact secrets and private data.
      render: shell
    validations:
      required: false
  - type: textarea
    id: fix-acceptance
    attributes:
      label: Acceptance criteria for the fix
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent project issue URL (if applicable)
      placeholder: https://github.com/ORG/REPO/issues/NN
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / secrets
      options:
        - label: This issue contains no credentials, tokens, or raw private/not-public material.
          required: true
